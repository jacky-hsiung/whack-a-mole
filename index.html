<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Whack</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0f0f0f; color: #f2f2f2; font-family: -apple-system, system-ui, sans-serif; overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #app { height: 100%; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px calc(env(safe-area-inset-bottom, 0px) + 20px); }
  #hud { display: flex; justify-content: space-between; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; opacity: .9; }
  #lives { display: flex; gap: 8px; align-items: center; justify-content: center; padding: 12px 0; }
  #lives i { width: 8px; height: 8px; border-radius: 50%; background: #f2f2f2; }
  #lives i.lost { background: #3a3a3a; }
  #grid-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; aspect-ratio: 1; width: min(100%, 100vh - 200px); }
  .hole { position: relative; border-radius: 50%; border: 2px solid #2a2a2a; }
  .mole { position: absolute; inset: 12%; border-radius: 50%; background: #f2f2f2; transform: scale(0); transition: transform .12s ease-out; }
  .hole.up .mole { transform: scale(1); }
  .hole.hit .mole { background: #0f0f0f; border: 2px solid #f2f2f2; transform: scale(1.3); opacity: 0; transition: transform .18s, opacity .18s; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #0f0f0f; text-align: center; padding: 24px; }
  #overlay.hidden { display: none; }
  h1 { font-size: 40px; font-weight: 700; letter-spacing: -.5px; }
  p { color: #8a8a8a; font-size: 17px; line-height: 1.4; }
  #start { font: inherit; font-weight: 600; font-size: 18px; padding: 16px 40px; border: 0; border-radius: 999px; background: #f2f2f2; color: #0f0f0f; }
</style>
</head>
<body>
<div id="app">
  <div id="hud"><span id="score">0</span><span id="time">0s</span></div>
  <div id="lives"><i></i><i></i><i></i></div>
  <div id="grid-wrap"><div id="grid"></div></div>
</div>
<div id="overlay">
  <h1>Whack</h1>
  <p>Tap the circles before they disappear.<br>Miss three and it's over.</p>
  <button id="start">Play</button>
</div>
<script>
(() => {
  const grid = document.getElementById('grid');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const livesEl = document.getElementById('lives');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('start');

  const holes = [];
  for (let i = 0; i < 9; i++) {
    const h = document.createElement('div');
    h.className = 'hole';
    h.innerHTML = '<div class="mole"></div>';
    h.dataset.i = i;
    grid.appendChild(h);
    holes.push({ el: h, up: false, timer: null });
  }

  let running = false, score = 0, misses = 0, startedAt = 0, spawnTimer = null, clock = null;

  const elapsed = () => (performance.now() - startedAt) / 1000;
  const spawnDelay = () => Math.max(350, 1000 - elapsed() * 18);
  const upTime = () => Math.max(500, 1300 - elapsed() * 22);

  function spawn() {
    if (!running) return;
    const free = holes.filter(h => !h.up);
    if (free.length) {
      const h = free[Math.floor(Math.random() * free.length)];
      h.up = true;
      h.el.classList.remove('hit');
      h.el.classList.add('up');
      h.timer = setTimeout(() => escape(h), upTime());
    }
    spawnTimer = setTimeout(spawn, spawnDelay());
  }

  function escape(h) {
    if (!h.up) return;
    h.up = false;
    h.el.classList.remove('up');
    misses++;
    livesEl.children[misses - 1]?.classList.add('lost');
    if (misses >= 3) end();
  }

  function whack(h) {
    if (!h.up) return;
    h.up = false;
    clearTimeout(h.timer);
    h.el.classList.remove('up');
    h.el.classList.add('hit');
    score++;
    scoreEl.textContent = score;
    if (navigator.vibrate) navigator.vibrate(10);
  }

  grid.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.hole');
    if (el && running) whack(holes[+el.dataset.i]);
  });

  function start() {
    score = 0; misses = 0; startedAt = performance.now();
    scoreEl.textContent = '0'; timeEl.textContent = '0s';
    [...livesEl.children].forEach(i => i.classList.remove('lost'));
    holes.forEach(h => { h.up = false; clearTimeout(h.timer); h.el.classList.remove('up', 'hit'); });
    overlay.classList.add('hidden');
    running = true;
    clock = setInterval(() => { timeEl.textContent = Math.floor(elapsed()) + 's'; }, 250);
    spawnTimer = setTimeout(spawn, 500);
  }

  function end() {
    running = false;
    clearTimeout(spawnTimer); clearInterval(clock);
    holes.forEach(h => { clearTimeout(h.timer); h.up = false; h.el.classList.remove('up'); });
    overlay.querySelector('h1').textContent = score;
    overlay.querySelector('p').textContent = `whacked in ${Math.floor(elapsed())}s`;
    startBtn.textContent = 'Play again';
    setTimeout(() => overlay.classList.remove('hidden'), 500);
  }

  startBtn.addEventListener('click', start);
})();
</script>
</body>
</html>
